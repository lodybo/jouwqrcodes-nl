name: 🚀 Deploy back-end

on:
  push:
    tags:
      - 'backend-v[0-9]+.[0-9]+.[0-9]+'
      - 'backend-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jouwqrcodes-backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.deploy-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.JQRC_PUSH_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # backend-v1.2.3        -> 1.2.3 + latest
          # backend-v1.2.3-beta.1 -> 1.2.3-beta.1 + beta
          tags: |
            type=match,pattern=backend-v(\d+\.\d+\.\d+(-beta\.\d+)?),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-beta') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}

      - name: Extract deploy image tag
        id: deploy-tag
        run: |
          echo "tag=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/back-end
          file: ./projects/back-end/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Tag**: \`${{ steps.deploy-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-app:
    runs-on: ubuntu-latest
    needs: docker
    # Beta tags are meant for the dev cluster (not wired up yet), never prod
    if: ${{ !contains(github.ref_name, '-no-deploy') && !contains(github.ref_name, '-beta') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 spindraad-app-cluster

      - name: Set Helm chart appVersion from tag
        run: |
          VERSION="${{ needs.docker.outputs.tag }}"
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" projects/back-end/Chart.yaml

      - name: ⚗️ Extract namespace from values.yaml
        uses: mikefarah/yq@v4.44.2
        id: namespace
        with:
          cmd: "yq .app.namespace projects/back-end/values.yaml"

      # Secrets go through a values file instead of --set, so commas or other
      # special characters in them can't break Helm's --set parsing.
      - name: Write secret values file
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PULL_TOKEN: ${{ secrets.JQRC_PULL_TOKEN }}
        run: |
          jq -n \
            --arg appKey "$APP_KEY" \
            --arg pgPassword "$POSTGRES_PASSWORD" \
            --arg pullToken "$PULL_TOKEN" \
            '{secrets: {appKey: $appKey}, postgres: {password: $pgPassword}, imagePullSecret: {password: $pullToken}}' \
            > "$RUNNER_TEMP/secret-values.json"

      - name: Deploy to cluster
        run: >
          helm upgrade --install
          jouwqrcodes-backend projects/back-end
          --create-namespace
          --namespace "${{ steps.namespace.outputs.result }}"
          --values "$RUNNER_TEMP/secret-values.json"
          --set-string "app.image.tag=${{ needs.docker.outputs.tag }}"
          --set "environment=production"
          --rollback-on-failure --wait --timeout 5m

      - name: Remove secret values file
        if: always()
        run: rm -f "$RUNNER_TEMP/secret-values.json"
