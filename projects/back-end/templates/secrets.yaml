apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
type: Opaque
stringData:
  appKey: {{ .Values.secrets.appKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-postgres-secret
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password }}