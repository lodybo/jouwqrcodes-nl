apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.app.name }}-https-redirect
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.ipWhitelist.middleware.name }}
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
{{- range .Values.ipWhitelist.middleware.sourceRange }}
      - {{ . }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.app.name }}-host-redirect
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
spec:
  redirectRegex:
    regex: "^https?://{{ .Values.app.domains.redirect }}(.*)"
    replacement: "https://{{ .Values.app.domains.production }}$1"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}-ingress
  namespace: {{ .Values.app.namespace }}
  labels: {{ toYaml .Values.app.labels | nindent 4 }}
    environment: {{ .Values.environment }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.app.domains.production }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-http-issuer
spec:
  rules:
    - host: {{ .Values.app.domains.production }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.port }}
    - host: www.{{ .Values.app.domains.production }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - secretName: {{ .Values.app.domains.production }}-cert
      hosts:
        - {{ .Values.app.domains.production }}
        - www.{{ .Values.app.domains.production }}
